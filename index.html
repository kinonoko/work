<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的專屬小網頁</title>
  <style>
    /* ========== 全域與背景設定 ========== */
    :root {
      --bg-color: #fdf6e3; /* 預設背景色 */
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background-color: var(--bg-color);
      transition: background-color 0.5s ease;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ========== 玻璃擬物化 (Glassmorphism) 卡片風格 ========== */
    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* ========== 頂部標題與時區 ========== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 {
      margin: 0;
      padding: 5px 10px;
      outline: none;
      border-bottom: 2px dashed transparent;
      transition: border-color 0.3s;
      cursor: text;
    }
    h1:focus, h1:hover {
      border-bottom: 2px dashed #ffb6c1;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }
    .timezone-widget {
      display: flex;
      gap: 15px;
    }
    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px 15px;
      border-radius: 12px;
      min-width: 120px;
    }
    .tz-label { font-size: 0.9em; color: #666; }
    .tz-select { border: none; background: transparent; font-size: 0.9em; color: #666; outline: none; cursor: pointer; text-align: center; font-family: inherit;}
    .tz-time { font-size: 1.3em; font-weight: bold; margin-top: 5px; letter-spacing: 1px;}

    /* ========== 主要網格排版 ========== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .card h2 {
      margin-top: 0;
      border-bottom: 2px solid rgba(255, 182, 193, 0.6);
      padding-bottom: 10px;
      font-size: 1.2em;
    }

    /* ========== 表單與按鈕 ========== */
    input, select, button, textarea {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 1em;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
    }
    input:focus, textarea:focus { border-color: #ffb6c1; }
    button {
      background: #ffd1dc;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
      color: #333;
    }
    button:hover { background: #ffb6c1; transform: translateY(-2px); }
    .add-action { display: flex; gap: 8px; margin-top: auto; padding-top: 15px; }
    .add-action input { flex: 1; min-width: 0; }

    /* ========== 列表項目 (倒數、行程、書籤) ========== */
    .list-container { flex: 1; overflow-y: auto; max-height: 250px; margin-bottom: 10px; padding-right: 5px;}
    .list-container::-webkit-scrollbar { width: 6px; }
    .list-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
      transition: 0.2s;
    }
    .item-row:hover { background: rgba(255, 255, 255, 0.8); }
    .cd-days { font-weight: bold; color: #ff6b81; font-size: 1.1em; margin-right: 10px;}
    .delete-btn { background: #ffcccb; color: #c0392b; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.8em; }
    .delete-btn:hover { background: #ff4757; color: white; }
    
    /* 書籤特別排版 */
    .bookmark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bm-link { text-decoration: none; color: #333; font-weight: bold; display: flex; align-items: center; gap: 5px; word-break: break-all;}
    .bm-link:hover { color: #ff6b81; }

    /* ========== 搜尋列與備忘錄 ========== */
    .search-container { display: flex; gap: 10px; align-items: center; height: 100%;}
    .search-container input { flex: 1; padding: 15px; font-size: 1.1em; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);}
    .search-container button { padding: 15px 25px; border-radius: 20px; font-size: 1.1em;}
    textarea { width: 100%; resize: none; min-height: 180px; box-sizing: border-box; background: rgba(255,255,255,0.6); line-height: 1.5; }

    /* ========== 右下角主題調色盤 ========== */
    .theme-picker {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 15px;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }
    .theme-picker input[type="color"] { border: none; padding: 0; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: transparent; }
    .theme-picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .theme-picker input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    @media (max-width: 768px) {
      .timezone-widget { width: 100%; justify-content: space-between; }
