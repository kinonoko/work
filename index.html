<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的專屬小網頁</title>
  <style>
    /* ========== 全域與背景設定 ========== */
    :root {
      --bg-color: #fdf6e3; /* 預設背景色 */
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background-color: var(--bg-color);
      transition: background-color 0.5s ease;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ========== 玻璃擬物化 (Glassmorphism) 卡片風格 ========== */
    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* ========== 頂部標題與時區 ========== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 {
      margin: 0;
      padding: 5px 10px;
      outline: none;
      border-bottom: 2px dashed transparent;
      transition: border-color 0.3s;
      cursor: text;
    }
    h1:focus, h1:hover {
      border-bottom: 2px dashed #ffb6c1;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }
    .timezone-widget {
      display: flex;
      gap: 15px;
    }
    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px 15px;
      border-radius: 12px;
      min-width: 120px;
    }
    .tz-label { font-size: 0.9em; color: #666; }
    .tz-select { border: none; background: transparent; font-size: 0.9em; color: #666; outline: none; cursor: pointer; text-align: center; font-family: inherit;}
    .tz-time { font-size: 1.3em; font-weight: bold; margin-top: 5px; letter-spacing: 1px;}

    /* ========== 主要網格排版 ========== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .card h2 {
      margin-top: 0;
      border-bottom: 2px solid rgba(255, 182, 193, 0.6);
      padding-bottom: 10px;
      font-size: 1.2em;
    }

    /* ========== 表單與按鈕 ========== */
    input, select, button, textarea {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 1em;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
    }
    input:focus, textarea:focus { border-color: #ffb6c1; }
    button {
      background: #ffd1dc;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
      color: #333;
    }
    button:hover { background: #ffb6c1; transform: translateY(-2px); }
    .add-action { display: flex; gap: 8px; margin-top: auto; padding-top: 15px; }
    .add-action input { flex: 1; min-width: 0; }

    /* ========== 列表項目 (倒數、行程、書籤) ========== */
    .list-container { flex: 1; overflow-y: auto; max-height: 250px; margin-bottom: 10px; padding-right: 5px;}
    .list-container::-webkit-scrollbar { width: 6px; }
    .list-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
      transition: 0.2s;
    }
    .item-row:hover { background: rgba(255, 255, 255, 0.8); }
    .cd-days { font-weight: bold; color: #ff6b81; font-size: 1.1em; margin-right: 10px;}
    .delete-btn { background: #ffcccb; color: #c0392b; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.8em; }
    .delete-btn:hover { background: #ff4757; color: white; }
    
    /* 書籤特別排版 */
    .bookmark-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bm-link { text-decoration: none; color: #333; font-weight: bold; display: flex; align-items: center; gap: 5px; word-break: break-all;}
    .bm-link:hover { color: #ff6b81; }

    /* ========== 搜尋列與備忘錄 ========== */
    .search-container { display: flex; gap: 10px; align-items: center; height: 100%;}
    .search-container input { flex: 1; padding: 15px; font-size: 1.1em; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);}
    .search-container button { padding: 15px 25px; border-radius: 20px; font-size: 1.1em;}
    textarea { width: 100%; resize: none; min-height: 180px; box-sizing: border-box; background: rgba(255,255,255,0.6); line-height: 1.5; }

    /* ========== 右下角主題調色盤 ========== */
    .theme-picker {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 15px;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }
    .theme-picker input[type="color"] { border: none; padding: 0; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: transparent; }
    .theme-picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .theme-picker input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    @media (max-width: 768px) {
      .timezone-widget { width: 100%; justify-content: space-between; }
      .time-box { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部：標題與時鐘 -->
    <header class="glass-card">
      <h1 contenteditable="true" id="dashboard-title">追星用小網頁</h1>
      <div class="timezone-widget">
        <div class="time-box">
          <span class="tz-label">台灣時間</span>
          <span class="tz-time" id="local-time">00:00:00</span>
        </div>
        <div class="time-box">
          <select id="tz-select" class="tz-select">
            <option value="Asia/Seoul">韓國時間 (KST)</option>
            <option value="Asia/Tokyo">日本時間 (JST)</option>
            <option value="America/New_York">美東時間 (EST)</option>
            <option value="Europe/London">英國時間 (GMT)</option>
          </select>
          <span class="tz-time" id="other-time">00:00:00</span>
        </div>
      </div>
    </header>

    <div class="grid">
      <!-- 1. 倒數計時 -->
      <section class="card glass-card">
        <h2>🎂 重要倒數</h2>
        <div class="list-container" id="countdown-list"></div>
        <div class="add-action">
          <input type="text" id="cd-name" placeholder="加入重要日期">
          <input type="date" id="cd-date">
          <button id="add-cd-btn">新增</button>
        </div>
      </section>

      <!-- 2. 行程與賽事 -->
      <section class="card glass-card">
        <h2>📅 行程與賽事</h2>
        <div class="list-container" id="schedule-list"></div>
        <div class="add-action">
          <input type="text" id="sch-name" placeholder="例如: T1 轉播 / PLAVE 直播">
          <input type="datetime-local" id="sch-date">
          <button id="add-sch-btn">新增</button>
        </div>
      </section>

      <!-- 3. 快速傳送門 -->
      <section class="card glass-card">
        <h2>📌 常用書籤</h2>
        <div class="list-container bookmark-grid" id="bookmark-list"></div>
        <div class="add-action">
          <input type="text" id="bm-name" placeholder="標題 (例: AO3)">
          <input type="text" id="bm-url" placeholder="網址 (https://...)">
          <button id="add-bm-btn">新增</button>
        </div>
      </section>

      <!-- 4. 快速搜尋 -->
      <section class="card glass-card">
        <h2>🔍 快速前往</h2>
        <div class="search-container">
          <input type="text" id="search-input" placeholder="輸入要搜尋的內容，或直接貼上網址...">
          <button id="search-btn">Go!</button>
        </div>
      </section>

      <!-- 5. 隨手記 -->
      <section class="card glass-card" style="grid-column: 1 / -1;">
        <h2>📝 靈感與備忘錄</h2>
        <textarea id="quick-note" placeholder="記錄一下突然冒出的腦洞、日文報告的想法，或是想買的清單吧..."></textarea>
      </section>
    </div>

    <!-- 右下角背景顏色控制 -->
    <div class="theme-picker">
      <label for="bg-color" style="font-weight:bold; color:#555;">🎨 背景色</label>
      <input type="color" id="bg-color" value="#fdf6e3">
    </div>
  </div>

  <script>
    /* ========== 共用功能 ========== */
    const el = (id) => document.getElementById(id);
    const save = (key, data) => localStorage.setItem(key, JSON.stringify(data));
    const load = (key, defaultVal) => JSON.parse(localStorage.getItem(key)) || defaultVal;

    /* ========== 1. 標題與備忘錄自動儲存 ========== */
    const titleEl = el('dashboard-title');
    titleEl.textContent = localStorage.getItem('dashTitle') || '追星用小網頁';
    titleEl.addEventListener('blur', () => localStorage.setItem('dashTitle', titleEl.textContent));

    const noteEl = el('quick-note');
    noteEl.value = localStorage.getItem('quickNote') || '';
    noteEl.addEventListener('input', () => localStorage.setItem('quickNote', noteEl.value));

    /* ========== 2. 背景顏色控制 ========== */
    const colorPicker = el('bg-color');
    const savedColor = localStorage.getItem('bgColor') || '#fdf6e3';
    colorPicker.value = savedColor;
    document.documentElement.style.setProperty('--bg-color', savedColor);
    colorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
      localStorage.setItem('bgColor', e.target.value);
    });

    /* ========== 3. 雙時區時鐘 ========== */
    const tzSelect = el('tz-select');
    tzSelect.value = localStorage.getItem('selectedTz') || 'Asia/Seoul';
    tzSelect.addEventListener('change', (e) => localStorage.setItem('selectedTz', e.target.value));

    function updateClocks() {
      const now = new Date();
      // 台灣時間
      el('local-time').textContent = now.toLocaleTimeString('zh-TW', { hour12: false });
      // 所選時區時間
      const otherTimeStr = new Intl.DateTimeFormat('zh-TW', {
        timeZone: tzSelect.value,
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
      el('other-time').textContent = otherTimeStr;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    /* ========== 4. 搜尋器 ========== */
    const searchInput = el('search-input');
    const searchBtn = el('search-btn');
    function doSearch() {
      let val = searchInput.value.trim();
      if(!val) return;
      // 判斷是否為網址，是的話直接跳轉，否則丟給 Google 搜尋
      if(val.match(/^((http:\/\/|https:\/\/)?(www\.)?[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/)) {
        if(!val.startsWith('http')) val = 'https://' + val;
        window.open(val, '_blank');
      } else {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(val)}`, '_blank');
      }
      searchInput.value = '';
    }
    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') doSearch(); });

    /* ========== 5. 清單資料管理 (倒數、行程、書籤) ========== */
    let countdowns = load('countdowns', []);
    let schedules = load('schedules', []);
    let bookmarks = load('bookmarks', [
      { name: 'AO3', url: 'https://archiveofourown.org' },
      { name: 'VLAST SHOP', url: 'https://vlastshop.com' },
      { name: 'Twitch', url: 'https://www.twitch.tv' },
      { name: 'YouTube', url: 'https://www.youtube.com' }
    ]);

    function refreshAllLists() {
      save('countdowns', countdowns);
      save('schedules', schedules);
      save('bookmarks', bookmarks);

      // 渲染倒數計時
      const cdContainer = el('countdown-list');
      cdContainer.innerHTML = '';
      const today = new Date();
      today.setHours(0,0,0,0);
      countdowns.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((cd, i) => {
        const targetDate = new Date(cd.date);
        const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
        let text = diffDays > 0 ? `還有 ${diffDays} 天` : diffDays === 0 ? '就是今天！🎉' : `已過 ${Math.abs(diffDays)} 天`;
        
        cdContainer.insertAdjacentHTML('beforeend', `
          <div class="item-row">
            <span>${cd.name}</span>
            <div>
              <span class="cd-days">${text}</span>
              <button class="delete-btn" onclick="deleteItem('cd', ${i})">刪除</button>
            </div>
          </div>
        `);
      });

      // 渲染行程表
      const schContainer = el('schedule-list');
      schContainer.innerHTML = '';
      schedules.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((sch, i) => {
        const d = new Date(sch.date);
        const timeStr = d.toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12: false});
        schContainer.insertAdjacentHTML('beforeend', `
          <div class="item-row">
            <div>
              <strong>${sch.name}</strong><br>
              <small style="color:#666;">${timeStr}</small>
            </div>
            <button class="delete-btn" onclick="deleteItem('sch', ${i})">刪除</button>
          </div>
        `);
      });

      // 渲染書籤
      const bmContainer = el('bookmark-list');
      bmContainer.innerHTML = '';
      bookmarks.forEach((bm, i) => {
        bmContainer.insertAdjacentHTML('beforeend', `
          <div class="item-row" style="margin-bottom:0;">
            <a href="${bm.url}" target="_blank" class="bm-link">🔗 ${bm.name}</a>
            <button class="delete-btn" onclick="deleteItem('bm', ${i})">x</button>
          </div>
        `);
      });
    }

    window.deleteItem = function(type, index) {
      if(type === 'cd') countdowns.splice(index, 1);
      if(type === 'sch') schedules.splice(index, 1);
      if(type === 'bm') bookmarks.splice(index, 1);
      refreshAllLists();
    }

    /* 新增按鈕事件 */
    el('add-cd-btn').addEventListener('click', () => {
      const name = el('cd-name').value || '加入重要日期';
      const date = el('cd-date').value;
      if(!date) return alert('請選擇日期喔！');
      countdowns.push({name, date});
      el('cd-name').value = ''; el('cd-date').value = '';
      refreshAllLists();
    });

    el('add-sch-btn').addEventListener('click', () => {
      const name = el('sch-name').value;
      const date = el('sch-date').value;
      if(!name || !date) return alert('名稱和時間都要填寫喔！');
      schedules.push({name, date});
      el('sch-name').value = ''; el('sch-date').value = '';
      refreshAllLists();
    });

    el('add-bm-btn').addEventListener('click', () => {
      const name = el('bm-name').value;
      let url = el('bm-url').value;
      if(!name || !url) return alert('名稱和網址都要填寫喔！');
      if(!url.startsWith('http')) url = 'https://' + url;
      bookmarks.push({name, url});
      el('bm-name').value = ''; el('bm-url').value = '';
      refreshAllLists();
    });

    // 初始化渲染
    refreshAllLists();
  </script>
</body>
</html>
